<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ｗ早稲田ゼミ ハイスクール｜友人紹介</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 提供資料に基づく「Dark Professional」テーマ */
        :root {
            --waseda-blue: #005CB9;
            --line-green: #06C755;
            --bg-color: #000000;
            --tile-color: #1f2937;
            --border-color: #374151;
            --text-main: #f5f5f5;
            --text-sub: #d1d5db;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* アクセントのデザイン */
        body::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 92, 185, 0.2) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* 塾のロゴエリア（ここに塾のロゴ画像をセットします） */
        #waseda-logo {
            max-width: 250px;
            height: auto;
            margin-bottom: 30px;
            z-index: 1;
        }

        /* コンテンツタイル */
        .content-card {
            background-color: var(--tile-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 1;
        }

        /* アイコン */
        .icon-box {
            width: 70px;
            height: 70px;
            background: var(--waseda-blue);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            margin: 0 auto 30px auto;
        }

        /* タイトルエリア（動的に書き換わる） */
        #title {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            line-height: 1.2;
        }
        #title span { color: var(--waseda-blue); } /* 青色の強調部分 */

        /* サブタイトル エリア（動的に書き換わる） */
        #subtitle {
            font-size: 18px;
            color: var(--text-sub);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* LINE紹介ボタン（機能はそのまま） */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px;
            background: var(--line-green);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
        }
        
        .btn:disabled {
            background: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
        }
        
        .btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(6, 199, 85, 0.3);
        }

    </style>
</head>
<body>

    <img id="waseda-logo" src="https://example.com/logo-wwaseda.png" alt="Ｗ早稲田ゼミ">

    <div class="content-card">
        <div class="icon-box">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        <h2 id="title">読み込み中...</h2>
        <p id="subtitle">パラメーターをチェックしています</p>
        
        <button id="share-btn" class="btn" disabled>
            <i class="fa-solid fa-share-nodes"></i>
            友だちに紹介を送る
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
